<div class="app-shell" [class.sidebar-open]="sidebarOpen">
  <div class="sidebar-overlay" (click)="sidebarOpen = false"></div>

  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/logo.png" alt="Fluencity" class="logo-img"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" />
      <span class="logo-fallback">Fluencity</span>
      <button class="sidebar-close" (click)="sidebarOpen = false"><mat-icon>close</mat-icon></button>
    </div>
    <nav>
      <a routerLink="/parent/dashboard" routerLinkActive="active"><mat-icon>home</mat-icon><span>Dashboard</span></a>
      <a routerLink="/parent/grades"    routerLinkActive="active"><mat-icon>grade</mat-icon><span>Child Grades</span></a>
      <a routerLink="/parent/planning"  routerLinkActive="active"><mat-icon>event_note</mat-icon><span>Planning</span></a>
      <a routerLink="/parent/payments"  routerLinkActive="active"><mat-icon>payments</mat-icon><span>Payments</span></a>
      <a routerLink="/parent/profile"   routerLinkActive="active"><mat-icon>manage_accounts</mat-icon><span>My Profile</span></a>
    </nav>
    <button class="logout-btn" (click)="logout()"><mat-icon>logout</mat-icon><span>Sign Out</span></button>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" (click)="sidebarOpen = !sidebarOpen"><mat-icon>menu</mat-icon></button>
        <span class="portal-title">Parent Portal</span>
      </div>
      <div class="topbar-right">
        <div class="user-menu-wrap">
          <button class="user-pill" (click)="userMenuOpen = !userMenuOpen; $event.stopPropagation()">
            <div class="avatar-circle parent">{{ userName[0]?.toUpperCase() }}</div>
            <span class="user-name">{{ userName }}</span>
            <mat-icon class="chevron">expand_more</mat-icon>
          </button>
          @if (userMenuOpen) {
            <div class="user-dropdown" (click)="$event.stopPropagation()">
              <div class="user-dropdown-header">
                <div class="avatar-circle parent lg">{{ userName[0]?.toUpperCase() }}</div>
                <div><div class="user-dropdown-name">{{ userName }}</div><div class="user-dropdown-email">{{ userEmail }}</div></div>
              </div>
              <div class="user-dropdown-divider"></div>
              <a routerLink="/parent/profile" class="user-dropdown-item" (click)="userMenuOpen = false"><mat-icon>manage_accounts</mat-icon> My Profile</a>
              <button class="user-dropdown-item danger" (click)="logout()"><mat-icon>logout</mat-icon> Sign Out</button>
            </div>
          }
        </div>
      </div>
    </header>
    <main class="content"><router-outlet></router-outlet></main>
  </div>
</div>
